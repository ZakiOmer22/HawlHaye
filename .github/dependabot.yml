version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Africa/Nairobi"
    open-pull-requests-limit: 5
    versioning-strategy: "increase"
    groups:
      security-patches:
        patterns: ["*"]
        update-types: ["patch", "minor"] # <-- Fixed: removed "security"
      minor-and-major:
        patterns: ["*"]
        update-types: ["minor", "major"]
    labels:
      - "dependencies"
      - "security"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
