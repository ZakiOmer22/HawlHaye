jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # 1. SPIN UP A TEMPORARY DATABASE FOR TESTS
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hawl
          POSTGRES_PASSWORD: hawl
          POSTGRES_DB: hawl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # 2. PASS ENV VARIABLES SO TESTS DON'T CRASH
    env:
      DATABASE_URL: postgresql://hawl:hawl@localhost:5432/hawl_test
      SESSION_SECRET: "test-secret-test-secret-test-secret-0000"
      CSRF_SECRET: "test-csrf-test-csrf-test-csrf-test-0000"
      AUDIT_CHAIN_SECRET: "test-audit-test-audit-test-audit-0000"
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck

      # 3. PUSH THE SCHEMA TO THE TEMPORARY DB
      - run: npx prisma db push -w @hawl/api

      - run: npm test
      - run: npm run build

      - name: Dependency audit (production deps, high severity)
        run: npm audit --omit=dev --audit-level=high

      - name: Generate SBOM
        uses: CycloneDX/gh-node-module-generatebom@v1
        with:
          path: ./
          output: ./sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: ./sbom.json
          retention-days: 90
