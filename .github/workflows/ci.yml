name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hawl
          POSTGRES_PASSWORD: hawl
          POSTGRES_DB: hawl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hawl -d hawl_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://hawl:hawl@localhost:5432/hawl_test
      SESSION_SECRET: "test-secret-test-secret-test-secret-0000"
      CSRF_SECRET: "test-csrf-test-csrf-test-csrf-test-0000"
      AUDIT_CHAIN_SECRET: "test-audit-test-audit-test-audit-0000"
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Secret scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma

      - name: Push test database schema
        run: npx prisma db push --schema=apps/api/prisma/schema.prisma

      # Build the shared workspace before running API scripts.
      - name: Build shared workspace
        run: npm run build -w @hawl/shared

      - name: Seed test database
        run: npm run db:seed -w @hawl/api

      - name: Format code
        run: npm run format

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build all workspaces
        run: npm run build

      - name: Dependency audit (production dependencies - critical)
        run: npm audit --omit=dev --audit-level=critical

      - name: Generate SBOM
        uses: CycloneDX/gh-node-module-generatebom@v1
        with:
          path: ./
          output: ./sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: ./sbom.json
          retention-days: 90
