name: CI
on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Dependency audit (production deps, high severity)
        run: npm audit --omit=dev --audit-level=high

      - name: Generate SBOM
        uses: CycloneDX/gh-node-module-generatebom@v1
        with:
          path: ./
          output: ./sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: ./sbom.json
          retention-days: 90

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Semgrep (SAST)
        uses: semgrep/semgrep-action@v1
        with:
          config: |
            p/default
            p/owasp-top-ten

      - name: Build API image
        run: docker build -f infra/Dockerfile.api -t hawl-api:scan .

      - name: Build Web image
        run: docker build -f infra/Dockerfile.web -t hawl-web:scan .

      - name: Trivy (API image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: hawl-api:scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Trivy (Web image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: hawl-web:scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
