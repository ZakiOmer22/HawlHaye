name: Weekly Security Scan

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install production dependencies
        run: npm ci --omit=dev

      # REPORT ONLY:
      # npm audit still runs and prints vulnerabilities.
      # Findings do not fail the scheduled workflow.
      - name: Dependency audit (production - high and above)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Generate SBOM
        uses: CycloneDX/gh-node-module-generatebom@v1
        with:
          path: ./
          output: ./sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-weekly-${{ github.run_id }}
          path: ./sbom.json
          retention-days: 180

      - name: Build API image
        run: docker build -f infra/Dockerfile.api -t hawl-api:weekly .

      - name: Build Web image
        run: docker build -f infra/Dockerfile.web -t hawl-web:weekly .

      # REPORT ONLY:
      # Trivy reports vulnerabilities but does not fail this workflow.
      - name: Trivy (API image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: hawl-api:weekly
          format: table
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Trivy (Web image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: hawl-web:weekly
          format: table
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
